<!DOCTYPE html>
<html lang="ru">
<head>

  <style>

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

      display: inline-block;
      background: #ff6a3d;
      color: #0d1321;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;

  <div>
